name: SmartHire CI

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - main

jobs:

  backend-tests:
  name: Backend Tests
  runs-on: ubuntu-latest

  services:
    redis:
      image: redis:7
      ports:
        - 6379:6379
      options: >-
        --health-cmd "redis-cli ping"
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      working-directory: backend
      env:
        MONGODB_URL: ${{ secrets.MONGODB_URL }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        REDIS_URL: redis://localhost:6379
        TESTING: "true"
      run: |
        pytest

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build